<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>

    <h1>Search for a Value</h1>

    <label>Enter array values (separated by commas):</label><br>
    <input type="text" id="arrayInput">

    <br><br>

    <label>Enter value to search:</label><br>
    <input type="number" id="searchValue">

    <br><br>

    <button onclick="searchArray()">Search</button>

    <h2>Entered Array:</h2>
    <p id="array"></p>

    <h2>Result:</h2>
    <p id="result"></p>

    <script>

        function searchArray() {

            let rawInput = document.getElementById("arrayInput").value;

            let numbers = [];

            let currentNum = "";

            for (let i = 0; i < rawInput.length; i++) {

                if (rawInput[i] === ",") {

                    numbers[numbers.length] = Number(currentNum.trim());

                    currentNum = "";

                } else {

                    currentNum += rawInput[i];

                }
            }

            numbers[numbers.length] = Number(currentNum.trim());


            let arrayOutput = "";

            for (let i = 0; i < numbers.length; i++) {

                arrayOutput +=
                    "Index " + i + ": " + numbers[i] + "<br>";

            }

            document.getElementById("array").innerHTML = arrayOutput;


            let search = Number(
                document.getElementById("searchValue").value
            );

            let found = false;


            for (let i = 0; i < numbers.length; i++) {

                if (numbers[i] === search) {

                    document.getElementById("result").innerHTML =
                        "Value " + search +
                        " found at index " + i + ".";

                    found = true;

                    break;
                }
            }


            if (found === false) {

                document.getElementById("result").innerHTML =
                    "Value " + search +
                    " does not exist in the array.";

            }
        }

    </script>

</body>
</html>
