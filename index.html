<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>

    <h1>Search for a Value</h1>

    <button onclick="searchArray()">Enter Array and Search</button>

    <h2>Result:</h2>
    <p id="result"></p>

    <script>

        function searchArray() {

            let numbers = [];

            let size = Number(prompt("Enter the number of elements:"));

            for (let i = 0; i < size; i++) {

                numbers[i] = Number(prompt("Enter value " + i + ":"));

            }

            let search = Number(prompt("Enter the value to search:"));

            let found = false;

            for (let i = 0; i < numbers.length; i++) {

                if (numbers[i] === search) {

                    document.getElementById("result").innerHTML =
                        "Value " + search + " found at index " + i + ".";

                    found = true;
                    break;
                }
            }

            if (found === false) {

                document.getElementById("result").innerHTML =
                    "Value " + search + " does not exist in the array.";

            }
        }

    </script>

</body>
</html>
